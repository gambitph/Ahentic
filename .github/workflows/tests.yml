name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Bounds of the range declared in readme.txt / phpcs.xml.dist.
        php: [ '7.4', '8.3' ]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: composer test

  e2e:
    name: Playwright e2e (Playground CLI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Browser-driven specs need the React sidebar under build/admin/ (gitignored).
      # Without this, class-script-loader.php skips enqueue and openWithSession hangs.
      - name: Build plugin assets
        run: npx wp-scripts build

      # No Docker / wp-env involved: playwright.config.js's `webServer` spawns
      # `@wp-playground/cli` (WASM PHP + SQLite) itself and tears it down after
      # the run — see tests/e2e/README.md.
      - name: Run Playwright e2e suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
